<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - Screenshot 4: 결과</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #E5E7EB;
            padding: 40px;
        }

        .phone-frame {
            width: 360px;
            height: 780px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
        }

        /* Success Icon */
        .success-icon {
            font-size: 120px;
            margin-bottom: 40px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: #FFFFFF;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 24px;
        }

        .highlight {
            font-size: 56px;
            display: block;
            margin: 16px 0;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            line-height: 1.6;
            max-width: 280px;
        }

        /* Brand */
        .brand {
            position: absolute;
            bottom: 40px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="success-icon">🎉</div>

        <div class="main-message">
            하루 평균<br>
            <span class="highlight">1시간</span><br>
            절약하세요
        </div>

        <div class="sub-message">
            의도적인 소비로<br>
            삶의 질이 달라집니다
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
