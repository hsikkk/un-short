<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - Screenshot 1: 문제</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #E5E7EB;
            padding: 40px;
        }

        /* Phone Frame: 1080x2340px scaled to 360x780 */
        .phone-frame {
            width: 360px;
            height: 780px;
            background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
        }

        /* Large Emoji */
        .emoji {
            font-size: 120px;
            margin-bottom: 40px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: #FFFFFF;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 24px;
        }

        .highlight {
            color: #EF4444;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: #D1D5DB;
            text-align: center;
            line-height: 1.6;
            max-width: 280px;
            margin-bottom: 60px;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #8B5CF6;
            margin-bottom: 8px;
        }

        .stat-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #9CA3AF;
        }

        /* Brand */
        .brand {
            position: absolute;
            bottom: 40px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="emoji">😰</div>

        <div class="main-message">
            하루에<br>
            <span class="highlight">몇 시간</span>을<br>
            쇼츠에 쓰나요?
        </div>

        <div class="sub-message">
            무의식적으로 스크롤하다<br>
            하루가 사라지고 있습니다
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">2.5</div>
                <div class="stat-label">시간/일</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">50+</div>
                <div class="stat-label">접속 횟수</div>
            </div>
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
