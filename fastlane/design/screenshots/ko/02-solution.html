<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - Screenshot 2: 솔루션</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            background: #F5F5F5;
            padding: 0;
            margin: 0;
        }

        .phone-frame {
            width: 1080px;
            height: 2340px;
            background: #FFFFFF;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 180px 120px;
        }

        /* Timer Circle */
        .timer-circle {
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: #F9FAFB;
            border: 8px solid #8B5CF6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 180px;
        }

        .timer-number {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 288px;
            font-weight: 800;
            color: #8B5CF6;
            line-height: 1;
        }

        .timer-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 60px;
            font-weight: 500;
            color: #6B7280;
            margin-top: 24px;
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 96px;
            font-weight: 800;
            color: #1A1A1A;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 60px;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 400;
            color: #6B7280;
            text-align: center;
            line-height: 1.5;
            max-width: 840px;
        }

        /* Brand */
        .brand {
            position: absolute;
            bottom: 120px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #E5E7EB;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="timer-circle">
            <div class="timer-number">30</div>
            <div class="timer-label">초</div>
        </div>

        <div class="main-message">
            30초만<br>
            멈춰보세요
        </div>

        <div class="sub-message">
            쇼츠를 열기 전<br>
            잠시 생각할 시간을 드립니다
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
