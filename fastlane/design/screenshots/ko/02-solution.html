<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - Screenshot 2: 솔루션</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #E5E7EB;
            padding: 40px;
        }

        .phone-frame {
            width: 360px;
            height: 780px;
            background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
        }

        /* Timer Circle */
        .timer-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 4px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
            backdrop-filter: blur(10px);
        }

        .timer-number {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 96px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1;
        }

        .timer-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: #FFFFFF;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 24px;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            line-height: 1.6;
            max-width: 280px;
        }

        /* Brand */
        .brand {
            position: absolute;
            bottom: 40px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="timer-circle">
            <div class="timer-number">30</div>
            <div class="timer-label">초</div>
        </div>

        <div class="main-message">
            30초만<br>
            멈춰보세요
        </div>

        <div class="sub-message">
            쇼츠를 열기 전<br>
            잠시 생각할 시간을 드립니다
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
