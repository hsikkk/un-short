<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - スクリーンショット 1: 問題</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            background: #E5E7EB;
            padding: 0;
            margin: 0;
        }

        /* Phone Frame: 1080x2340px */
        .phone-frame {
            width: 1080px;
            height: 2340px;
            background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 180px 120px;
        }

        /* Large Emoji */
        .emoji {
            font-size: 360px;
            margin-bottom: 120px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 108px;
            font-weight: 900;
            color: #FFFFFF;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 72px;
        }

        .highlight {
            color: #EF4444;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 54px;
            font-weight: 400;
            color: #D1D5DB;
            text-align: center;
            line-height: 1.6;
            max-width: 840px;
            margin-bottom: 180px;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 120px;
            margin-bottom: 120px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 144px;
            font-weight: 900;
            color: #8B5CF6;
            margin-bottom: 24px;
        }

        .stat-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 42px;
            font-weight: 600;
            color: #9CA3AF;
        }

        /* Brand */
        .brand {
            position: absolute;
            bottom: 120px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 60px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="emoji">😰</div>

        <div class="main-message">
            1日に<br>
            <span class="highlight">何時間</span>を<br>
            ショート動画に費やしますか？
        </div>

        <div class="sub-message">
            無意識にスクロールしながら<br>
            1日が消えていきます
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">2.5</div>
                <div class="stat-label">時間/日</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">50+</div>
                <div class="stat-label">アクセス回数</div>
            </div>
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
