<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - スクリーンショット 4: 結果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            background: #F5F5F5;
            padding: 0;
            margin: 0;
        }

        .phone-frame {
            width: 1080px;
            height: 2340px;
            background: #FFFFFF;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 180px 120px;
        }

        /* Success Icon */
        .success-icon {
            font-size: 240px;
            margin-bottom: 120px;
        }

        
            50% { transform: translateY(-60px); }
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 96px;
            font-weight: 800;
            color: #1A1A1A;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 60px;
        }

        .highlight {
            font-size: 144px;
            display: block;
            margin: 48px 0;
            color: #10B981;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 400;
            color: #6B7280;
            text-align: center;
            line-height: 1.5;
            max-width: 840px;
        }

        /* Brand */
        .brand {
            position: absolute;
            bottom: 120px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #E5E7EB;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="success-icon">🎉</div>

        <div class="main-message">
            1日平均<br>
            <span class="highlight">1時間</span><br>
            節約できます
        </div>

        <div class="sub-message">
            意図的な消費で<br>
            生活の質が変わります
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
