<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - Screenshot 3: Feature</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            background: #F5F5F5;
            padding: 0;
            margin: 0;
        }

        .phone-frame {
            width: 1080px;
            height: 2340px;
            background: #FFFFFF;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 180px 120px;
        }

        .emoji {
            font-size: 240px;
            margin-bottom: 120px;
        }

        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 96px;
            font-weight: 800;
            color: #1A1A1A;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 60px;
        }

        .highlight {
            color: #8B5CF6;
        }

        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 400;
            color: #6B7280;
            text-align: center;
            line-height: 1.5;
            max-width: 840px;
        }

        .brand {
            position: absolute;
            bottom: 120px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #E5E7EB;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="emoji">🤔</div>

        <div class="main-message">
            Do you<br>
            <span class="highlight">really need</span><br>
            to watch now?
        </div>

        <div class="sub-message">
            Simply asking the question<br>
            breaks unconscious habits
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
