<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - Ekran Görüntüsü 1: Sorun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            background: #F5F5F5;
            padding: 0;
            margin: 0;
        }

        /* Phone Frame: 1080x2340px */
        .phone-frame {
            width: 1080px;
            height: 2340px;
            background: #FFFFFF;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 180px 120px;
        }

        /* Large Emoji */
        .emoji {
            font-size: 240px;
            margin-bottom: 120px;
        }

        
            50% { transform: translateY(-30px); }
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 96px;
            font-weight: 800;
            color: #1A1A1A;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 60px;
        }

        .highlight {
            color: #EF4444;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 400;
            color: #6B7280;
            text-align: center;
            line-height: 1.5;
            max-width: 840px;
            margin-bottom: 180px;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 120px;
            margin-bottom: 120px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 120px;
            font-weight: 800;
            color: #EF4444;
            margin-bottom: 24px;
        }

        .stat-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 40px;
            font-weight: 500;
            color: #9CA3AF;
        }

        /* Brand */
        .brand {
            position: absolute;
            bottom: 120px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 800;
            color: #E5E7EB;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="emoji">😰</div>

        <div class="main-message">
            Günde<br>
            <span class="highlight">kaç saat</span><br>
            Shorts'ta harcıyorsun?
        </div>

        <div class="sub-message">
            Bilinçsizce kaydırıyorsun<br>
            ve gün kayboluyor
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">2.5</div>
                <div class="stat-label">saat/gün</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">50+</div>
                <div class="stat-label">erişim</div>
            </div>
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
