<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - ภาพหน้าจอ 2: แนวทางแก้ไข</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            background: #E5E7EB;
            padding: 0;
            margin: 0;
        }

        .phone-frame {
            width: 1080px;
            height: 2340px;
            background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 180px 120px;
        }

        /* Timer Circle */
        .timer-circle {
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 12px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 180px;
            backdrop-filter: blur(10px);
        }

        .timer-number {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 288px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1;
        }

        .timer-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 60px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 24px;
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 108px;
            font-weight: 900;
            color: #FFFFFF;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 72px;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 54px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            line-height: 1.6;
            max-width: 840px;
        }

        /* Brand */
        .brand {
            position: absolute;
            bottom: 120px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 60px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="timer-circle">
            <div class="timer-number">30</div>
            <div class="timer-label">วินาที</div>
        </div>

        <div class="main-message">
            หยุดแค่ 30 วินาที<br>
            เพื่อคิด
        </div>

        <div class="sub-message">
            ก่อนเปิด Shorts<br>
            ให้เวลาตัวเองคิดสักครู่
        </div>

        <div class="brand">un:short</div>
    </div>
</body>
</html>
