<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshort - Feature Graphic (ภาษาไทย)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            background: #F5F5F5;
            padding: 0;
            margin: 0;
        }

        /* Feature Graphic Container: 1024x500px */
        .feature-graphic {
            width: 1024px;
            height: 500px;
            background: #FFFFFF;
            position: relative;
            overflow: hidden;
        }

        

        /* Content Container */
        .content {
            position: relative;
            z-index: 2;
            padding: 60px 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Brand Logo */
        .logo {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 56px;
            font-weight: 900;
            color: #1A1A1A;
            letter-spacing: 0.02em;
            margin-bottom: 20px;
        }

        .logo .colon {
            color: #8B5CF6;
        }

        /* Main Message */
        .main-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #1A1A1A;
            line-height: 1.4;
            margin-bottom: 24px;
            max-width: 600px;
        }

        .highlight {
            color: #8B5CF6;
            position: relative;
        }

        /* Sub Message */
        .sub-message {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: #6B7280;
            line-height: 1.6;
            max-width: 550px;
            margin-bottom: 32px;
        }

        /* Features */
        .features {
            display: flex;
            gap: 40px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: #F3F4F6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .feature-text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #1A1A1A;
        }

        /* Decorative Element - Timer */
        .timer-decoration {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            text-align: center;
        }

        .timer-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #F9FAFB;
            border: 3px solid #8B5CF6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-number {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 72px;
            font-weight: 800;
            color: #8B5CF6;
            line-height: 1;
        }

        .timer-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 18px;
            font-weight: 500;
            color: #6B7280;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="feature-graphic">
        <!-- Main Content -->
        <div class="content">
            <div class="logo">un:short</div>

            <div class="main-message">
                หลุดพ้นจาก<span class="highlight">การติดวิดีโอสั้น</span><br>
                สร้างนิสัยการรับชมอย่างมีสติ
            </div>

            <div class="sub-message">
                บล็อก YouTube Shorts และ Instagram Reels<br>
                หยุดการเลื่อนดูแบบไร้สติด้วยเวลาคิด 30 วินาที
            </div>

            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon">⏱️</div>
                    <div class="feature-text">รอ 30 วินาที</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🤔</div>
                    <div class="feature-text">ถามตัวเอง</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎯</div>
                    <div class="feature-text">บล็อกอัตโนมัติ</div>
                </div>
            </div>
        </div>

        <!-- Timer Decoration -->
        <div class="timer-decoration">
            <div class="timer-circle">
                <div class="timer-number">30</div>
                <div class="timer-label">วินาที</div>
            </div>
        </div>
    </div>
</body>
</html>
